[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-release-management"
version = "0.1.0"
description = "Local RM-0 release control and provenance verification pilot"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.0",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.11.2",
]

[tool.setuptools]
packages = ["release"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
